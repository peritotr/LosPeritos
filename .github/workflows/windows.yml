name: Windows build

# Builds the unsigned Windows package, starts it once with the demo bureau, and keeps the package
# and the pictures of that run. Started by hand, and for every version tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: node scripts/smoke-packaged.mjs apps/desktop/release/LosPeritos-win32-x64/LosPeritos.exe smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-pictures
          path: smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: LosPeritos-windows
          path: apps/desktop/release/*.zip
          compression-level: 0
