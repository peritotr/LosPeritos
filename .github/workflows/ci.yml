name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The merge tests create commits.
      # ... and compare file contents, so line endings are left as they are.
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.invalid" && git config --global core.autocrlf false
      - run: npm test
      - run: npm run typecheck:ui
      - run: npm run build --workspace @losperitos/ui
      - run: npm run build --workspace @losperitos/desktop
